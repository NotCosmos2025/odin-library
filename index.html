<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>

</head>
<body>

    <div class="container">

        <div class="controls-container">
            <button id="new_book-btn">New Book</button>
            <dialog>
                <button autofocus id="close-btn">X</button>
                <form action="index.html" method="GET">
                    <div class="dialog-controls-container">
                        <div class="dialog-controls-row">
                            <label for="title">Title: </label>
                            <input type="text" id="title" name="title" placeholder="Harry Potter">
                        </div>
                        <div class="dialog-controls-row">
                            <label for="author">Author: </label>
                            <input type="text" id="author" name="author" placeholder="J. K. Rowling">
                        </div>

                        <div class="dialog-controls-row">
                            <label for="number_of_pages">Number of Pages: </label>
                            <input type="number" id="number_of_pages" name="number_of_pages" placeholder="666">
                        </div>

                        <div class="dialog-controls-row">
                            <label for="read_status"> Status: </label>
                            <select name="read_status" id="read_status">
                                <option value="not_started">Not Started</option>
                                <option value="reading">Reading</option>
                                <option value="finished">Finished</option>
                            </select>
                            
                        </div>

                        <div class="dialog-controls-row">
                            <button type="submit" id="add_book-btn">Add</button>
                        </div>

                    </div>
                </form>
            </dialog>
        </div>
        <div class="books-container">
        </div>

    </div>

</body>
</html>
